name: Release

# Cut a release by pushing a tag that matches the versionName in app/build.gradle.kts:
#   git tag -a v0.1.0 -m "Lagoon 0.1.0" && git push origin v0.1.0
# See docs/release.md for the full checklist (keystore, Play closed test, F-Droid).
#
# Signing: when the four secrets below are configured the APK and the Play bundle are signed
# with the release key. Without them the workflow still runs and publishes an UNSIGNED APK
# (useful for forks and dry runs; it cannot be installed on a device).
#   KEYSTORE_BASE64   base64 of lagoon-release.jks (base64 -i lagoon-release.jks | pbcopy)
#   KEYSTORE_PASSWORD keystore password
#   KEY_ALIAS         key alias inside the keystore (e.g. lagoon)
#   KEY_PASSWORD      key password

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read from a step-level `if`, so expose the decision as an env var.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version from app/build.gradle.kts and check it matches the tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)"
          echo "tag=$TAG versionName=$NAME versionCode=$CODE"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag v$TAG does not match versionName \"$NAME\" in app/build.gradle.kts. Bump versionCode/versionName first (docs/release.md)."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # A tag with a suffix (v0.2.0-beta.1) becomes a GitHub pre-release.
          case "$TAG" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/lagoon-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          # keystore.properties is gitignored and read by app/build.gradle.kts.
          {
            echo "storeFile=$KS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Release signing configured."

      - name: Unsigned build notice
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::No KEYSTORE_BASE64 secret, building an UNSIGNED release (not installable)."

      - name: Unit tests
        run: ./gradlew testFossReleaseUnitTest --no-daemon

      - name: Build FOSS APK and Play bundle
        run: ./gradlew assembleFossRelease bundlePlayRelease --no-daemon

      - name: Zero-network guarantee (no INTERNET permission in merged manifests)
        run: |
          set -euo pipefail
          found=0
          for variant in fossRelease playRelease; do
            manifest="$(find "app/build/intermediates/merged_manifest/$variant" -name AndroidManifest.xml | head -n 1 || true)"
            if [ -z "$manifest" ]; then
              echo "::error::Merged manifest for $variant not found under app/build/intermediates/merged_manifest/$variant"
              exit 1
            fi
            found=1
            if grep -q 'android.permission.INTERNET' "$manifest"; then
              echo "::error::$manifest declares android.permission.INTERNET. Lagoon must never talk to the network; a dependency probably merged it in. Remove it with tools:node=\"remove\" or drop the dependency."
              grep -n 'INTERNET' "$manifest"
              exit 1
            fi
            echo "OK: $variant has no INTERNET permission ($manifest)"
          done
          [ "$found" = 1 ]

      - name: Collect artefacts
        id: collect
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Signed builds produce app-foss-release.apk, unsigned ones app-foss-release-unsigned.apk.
          APK="$(ls app/build/outputs/apk/foss/release/*.apk | head -n 1)"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp "$APK" "dist/lagoon-$VERSION-foss.apk"
          else
            cp "$APK" "dist/lagoon-$VERSION-foss-unsigned.apk"
          fi
          cp app/build/outputs/bundle/playRelease/*.aab "dist/lagoon-$VERSION-play.aab"
          cp app/build/outputs/mapping/fossRelease/mapping.txt "dist/lagoon-$VERSION-foss-mapping.txt"
          cp app/build/outputs/mapping/playRelease/mapping.txt "dist/lagoon-$VERSION-play-mapping.txt"
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Verify APK signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose --print-certs dist/lagoon-*-foss.apk

      - name: Keep everything as a workflow artefact (bundle and mapping files stay private)
        uses: actions/upload-artifact@v4
        with:
          name: lagoon-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

      - name: Release notes from the Fastlane changelog
        id: notes
        env:
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          NOTES="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          {
            if [ -f "$NOTES" ]; then cat "$NOTES"; else echo "No changelog entry for versionCode $CODE yet."; fi
            echo
            echo
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "The APK is signed with the Lagoon release key. Verify the download with \`sha256sum -c SHA256SUMS.txt\`."
            else
              echo "This APK is UNSIGNED (built without a release keystore) and cannot be installed as-is."
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lagoon ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/lagoon-*-foss*.apk
            dist/lagoon-*-foss-mapping.txt
            dist/SHA256SUMS.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lagoon-release.jks" keystore.properties
