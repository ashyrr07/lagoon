name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testFossDebugUnitTest --no-daemon
      - name: Assemble
        run: ./gradlew assembleFossDebug assemblePlayDebug --no-daemon
      - name: Zero-network guarantee (no INTERNET permission in merged manifests)
        # Lagoon's privacy promise is "no INTERNET permission". A dependency can merge the
        # permission in silently, so check the *merged* manifest of both flavors, not the source.
        run: |
          set -euo pipefail
          for variant in fossDebug playDebug; do
            manifest="$(find "app/build/intermediates/merged_manifest/$variant" -name AndroidManifest.xml | head -n 1 || true)"
            if [ -z "$manifest" ]; then
              echo "::error::Merged manifest for $variant not found under app/build/intermediates/merged_manifest/$variant (did the Assemble step change?)"
              exit 1
            fi
            if grep -q 'android.permission.INTERNET' "$manifest"; then
              echo "::error::$manifest declares android.permission.INTERNET. Lagoon must never talk to the network; a dependency probably merged it in. Remove it with tools:node=\"remove\" or drop the dependency."
              grep -n 'INTERNET' "$manifest"
              exit 1
            fi
            echo "OK: $variant has no INTERNET permission ($manifest)"
          done
      - name: Lint
        run: ./gradlew lintFossDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lagoon-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
