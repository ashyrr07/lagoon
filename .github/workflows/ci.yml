name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testFossDebugUnitTest --no-daemon
      - name: Assemble
        run: ./gradlew assembleFossDebug assemblePlayDebug --no-daemon
      - name: Lint
        run: ./gradlew lintFossDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lagoon-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
